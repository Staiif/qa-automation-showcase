appId: com.taskly
name: Connexion valide — affiche le tableau de l'utilisateur
tags: [auth]
---
- launchApp:
    clearState: true
- runFlow:
    file: ../common/login.yaml
    env:
      EMAIL: ${EMAIL}
      PASSWORD: ${PASSWORD}
- assertVisible:
    id: "board-title"
- assertVisible:
    text: ${EMAIL}
