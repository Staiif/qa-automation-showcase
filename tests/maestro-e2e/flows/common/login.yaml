# Subflow réutilisable : saisie des identifiants + soumission.
# EMAIL / PASSWORD sont injectés par le flow appelant (runFlow.env).
appId: com.taskly
---
- tapOn:
    id: "login-email"
- inputText: ${EMAIL}
# NB : pas de `hideKeyboard` — il envoie un Back, et sur l'image CI `aosp_atd`
# (sans clavier logiciel) ce Back ferme l'app. Voir README § « Émulateur ATD ».
- tapOn:
    id: "login-password"
- inputText: ${PASSWORD}
- tapOn:
    id: "login-submit"
