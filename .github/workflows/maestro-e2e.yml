name: Maestro E2E (mobile, YAML)

# Maestro drives the real React Native build on an Android emulator — same
# device matrix as the Detox and Appium jobs (Pixel_7_API_34, aosp_atd), but
# through declarative YAML flows instead of test code.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - '!apps/mobile/**/*.md'
      - 'tests/maestro-e2e/**'
      - '.github/workflows/maestro-e2e.yml'

jobs:
  maestro-android:
    name: Maestro — Android emulator (YAML flows)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v5

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Provision env
        run: cp .env.example .env

      - name: Install mobile app deps
        working-directory: apps/mobile
        run: npm install

      # Release embeds the Hermes JS bundle → the APK is self-contained (no Metro).
      - name: Build release APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease

      # The emulator OOMs if the Gradle daemons keep holding RAM — free it first.
      - name: Free memory before the emulator
        run: |
          (cd apps/mobile/android && ./gradlew --stop) || true
          free -h

      - name: Install Maestro CLI
        run: |
          curl -Ls https://get.maestro.mobile.dev | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: AVD snapshot cache
        uses: actions/cache@v5
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-pixel7-atd-maestro-v1

      - name: Create AVD snapshot (on cache miss)
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: aosp_atd
          arch: x86_64
          profile: pixel_7
          avd-name: Pixel_7_API_34
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot-load
          disable-animations: false
          script: adb shell settings put global hide_error_dialogs 1

      - name: Run Maestro suite (Android emulator)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: aosp_atd
          arch: x86_64
          profile: pixel_7
          avd-name: Pixel_7_API_34
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot-save
          disable-animations: true
          working-directory: tests/maestro-e2e
          # Single line on purpose: the action runs inline `script:` lines individually.
          script: adb shell settings put global hide_error_dialogs 1 && adb install -r ../../apps/mobile/android/app/build/outputs/apk/release/app-release.apk && npm test

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: maestro-report
          path: tests/maestro-e2e/reports/
          if-no-files-found: ignore
          retention-days: 14
